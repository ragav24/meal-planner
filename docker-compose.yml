services:
  meal-planner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:80"
    depends_on:
      - items-service
    restart: unless-stopped

  items-service:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/mealplanner
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
