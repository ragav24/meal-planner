services:
  meal-planner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:80"
    restart: unless-stopped
    networks:
      - meal-planner-net

networks:
  # Shared with the meal-planner-service repo's compose project so nginx can
  # reverse-proxy /api/ to its `items-service` container by name. Create once
  # with `docker network create meal-planner-net`, then run `docker compose up`
  # in both repos. See that repo's CLAUDE.md for details.
  meal-planner-net:
    external: true
